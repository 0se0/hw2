[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "churn-ensemble"
version = "0.1.0"
description = "Bank customer churn: OOF ensemble with fair evaluation"
requires-python = ">=3.9"
dependencies = ["numpy", "pandas", "scipy", "scikit-learn", "lightgbm", "xgboost", "joblib"]

[project.scripts]
churn-train = "churn.train:main"
churn-predict = "churn.predict:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
